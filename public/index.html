<!DOCTYPE html>
<html ng-app="myApp">
    <head>
        <title>Book Exchange Portal</title>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>
    </head>
    <style>
        .fade.ng-enter {
            transition: 0.5s linear all;
            opacity: 0;
        }
        .fade.ng-enter-active {
            opacity: 1;
        }
        .fade.ng-leave {
            transition: 0.5s linear all;
            opacity: 1;
        }
        .fade.ng-leave-active {
            opacity: 0;
        }
        body{
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1{
            text-align: center;
            color: #333;
        }
        h3{
            color: #555;
        }
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: #fff;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        </style>
        <body ng-controller="myCtrl">
            <div class = "container">
                <h1>Book Exchange Portal</h1>
            <form ng-submit="addBook()">
                <div class="form-row">
                <input ng-model="title" placeholder="Title" required>
                <input ng-model="owner" placeholder="Owner" required>
                <select ng-model="condition" required>
                    <option value="">Select Condition</option>
                    <option value="New">New</option>
                    <option value="Old">Old</option>
                </select>
                <button type="submit">Add Book</button>
                <input ng-model="contact" placeholder="Contact Information" required>
                </div>
            </form>
            <p class ="message">{{message}}</p>
            <h3>Available Books</h3>
            <input ng-model="search" placeholder="Search by title">
            <select ng-model="filterCondition">
                <option value="All">All</option>
                <option value="New">New</option>
                <option value="Old">Old</option>
            </select>
            <button ng-click="viewBooks()">View Books</button>
            <button ng-click="clearFilters()">Clear Filters</button>
            <div>
                <table>
                    <tr>
                    <th>Title</th>
                    <th>Owner</th>
                    <th>Condition</th>
                    <th>Contact</th>
                    <th>Action</th>
                </tr>
                <tr ng-repeat="b in books" class="fade">
                    <td>{{b.title}}</td>
                    <td>{{b.owner}}</td>
                    <td>{{b.condition}}</td>
                    <td>{{b.contact}}</td>
                    <td>
                        <button ng-click="updateBook(b)">Update</button>
                        <button ng-click="deleteBook(b._id)">Delete</button>
                    </td>
                </tr>
                <tr ng-if="books.length == 0">
                    <td colspan="5">No books available</td>
                </tr>
                </table>
            </div>
        </div>
        <script>
            angular.module('myApp', ['ngAnimate'])
            .controller('myCtrl', function($scope, $http) {
                $scope.books=[];
                $scope.search="";
                $scope.filterCondition="All";
                $scope.viewBooks=function(){
                    $http.get("/books", {
                        params:{
                            search: $scope.search,
                            condition: $scope.filterCondition
                        }
                    }).then(function(response){
                        $scope.books=response.data;
                    });
                };
                $scope.addBook=function(){
                    $http.post("/add", {
                        title:$scope.title,
                        owner:$scope.owner,
                        condition:$scope.condition,
                        contact:$scope.contact
                    }).then(function(response){
                        $scope.message=response.data;
                        $scope.viewBooks();
                    });
                };
                $scope.updateBook=function(b){
                    let title = prompt("Enter new title:", b.title);
                    let owner = prompt("Enter new owner:", b.owner);
                    let condition = prompt("Enter new condition (New/Old):", b.condition);
                    let contact = prompt("Enter new contact information:", b.contact);
                    if(title && owner && condition && contact){
                        $http.put("/update/"+b._id, {
                            title:title,
                            owner:owner,
                            condition:condition,
                            contact:contact
                        }).then(function(response){
                            $scope.message=response.data;
                            $scope.viewBooks();
                        });
                    }
                };
                $scope.deleteBook=function(id){
                    if(confirm("Are you sure you want to delete this book?")){
                        $http.delete("/delete/"+id).then(function(response){
                            $scope.message=response.data;
                            $scope.viewBooks();
                        });
                    }
                };
                $scope.clearFilters=function(){
                    $scope.search="";
                    $scope.filterCondition="All";
                    $scope.viewBooks();
                };
                $scope.viewBooks();
            });
        </script>
    </body>
</html>
